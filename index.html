<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1118;color:#cfe8ff;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
#orb{width:140px;height:140px;border-radius:50%;border:2px solid #3ab6ff;background:radial-gradient(#0f3550,#0b1118);color:#8fd3ff;font-size:16px;margin:24px 0 12px;box-shadow:0 0 30px #3ab6ff55}
#orb.on{animation:p 1.6s infinite}
@keyframes p{50%{box-shadow:0 0 55px #3ab6ffaa}}
#status{margin-bottom:12px;color:#8fd3ff}
#log{width:100%;max-width:480px;flex:1;overflow-y:auto}
#log div{padding:6px 0;line-height:1.4}.me{color:#9fb3c4}.ai{color:#fff}
details{width:100%;max-width:480px;margin-top:12px}
input{width:100%;box-sizing:border-box;margin:4px 0;padding:10px;border-radius:8px;border:1px solid #28445a;background:#101c27;color:#fff}
button.s{padding:10px 14px;margin:4px 4px 0 0;border-radius:8px;border:0;background:#3ab6ff;color:#06121c;font-weight:600}
</style></head><body>
<button id="orb">Tap to start</button>
<button class="s" id="langBtn"></button>
<div id="status">Tap the orb, then say “Jarvis…”</div>
<div id="log"></div>
<details><summary>Settings</summary>
<input id="gemini" type="password" placeholder="Google Gemini API key">
<input id="spotifyId" placeholder="Spotify Client ID">
<input id="elKey" type="password" placeholder="ElevenLabs API key (optional)">
<input id="elVoice" placeholder="ElevenLabs voice ID (optional)">
<button class="s" id="save">Save</button><button class="s" id="conn">Connect Spotify</button>
<div id="spstat"></div></details>
<script>
const $=id=>document.getElementById(id);
const S={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const log=(w,t)=>{const d=document.createElement("div");d.className=w;d.textContent=(w=="me"?"You: ":"Jarvis: ")+t;$("log").prepend(d)};
const status=t=>$("status").textContent=t;

// ---------- Spotify (PKCE, no server) ----------
const REDIRECT=location.origin+location.pathname;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function spLogin(){
  const id=S.get("spotifyId");if(!id){alert("Save your Spotify Client ID first");return}
  const v=b64(crypto.getRandomValues(new Uint8Array(32)));S.set("verifier",v);
  const c=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  location=`https://accounts.spotify.com/authorize?${new URLSearchParams({client_id:id,response_type:"code",redirect_uri:REDIRECT,scope:"user-modify-playback-state user-read-playback-state",code_challenge_method:"S256",code_challenge:c})}`;
}
async function tokenReq(p){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:S.get("spotifyId"),...p})});
  const j=await r.json();
  if(j.access_token){S.set("spTok",j.access_token);S.set("spExp",Date.now()+j.expires_in*1000-60000);if(j.refresh_token)S.set("spRef",j.refresh_token)}
}
async function spToken(){
  if(!S.get("spTok"))return null;
  if(Date.now()>+S.get("spExp"))await tokenReq({grant_type:"refresh_token",refresh_token:S.get("spRef")});
  return S.get("spTok");
}
async function sp(path,opt={}){
  const t=await spToken();if(!t)throw new Error("Spotify not connected");
  return fetch("https://api.spotify.com/v1"+path,{...opt,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"}});
}
const tools={
  async play_song({query}){
    const r=await sp("/search?"+new URLSearchParams({q:query,type:"track",limit:1}));
    const t=(await r.json()).tracks?.items?.[0];if(!t)return T("No results for "+query,"Δεν βρέθηκε: "+query);
    const p=await sp("/me/player/play",{method:"PUT",body:JSON.stringify({uris:[t.uri]})});
    if(p.status==404)return T("No active Spotify device. Open the Spotify app, play anything once, then retry.","Δεν υπάρχει ενεργή συσκευή Spotify. Άνοιξε την εφαρμογή, παίξε ένα τραγούδι και ξαναδοκίμασε.");
    if(p.status==403)return T("Spotify refused. Premium is required.","Το Spotify αρνήθηκε. Χρειάζεται Premium.");
    return T(`Now playing ${t.name} by ${t.artists[0].name}.`,`Παίζει τώρα: ${t.name} από ${t.artists[0].name}.`);
  },
  async pause_music(){await sp("/me/player/pause",{method:"PUT"});return T("Paused.","Σε παύση.")},
  create_event:a=>eventCard(a)
};

// ---------- Gemini ----------
const T=(en,el)=>lang=="el-GR"?el:en;
const MODEL="gemini-flash-latest";
const SYSTEM="You are Jarvis, a calm, dryly witty British butler-style assistant who speaks fluent Greek and English. Always reply in the language the user just spoke (Greek or English). Replies are spoken aloud: 1-3 short sentences, no markdown or lists. Use play_song for music, pause_music to pause, and create_event to add calendar events (work out exact dates from the current date and time; assume 1 hour if no duration is given).";
const TOOLS=[{functionDeclarations:[
  {name:"play_song",description:"Search Spotify for a song and play it.",parameters:{type:"OBJECT",properties:{query:{type:"STRING",description:"Song title and artist"}},required:["query"]}},
  {name:"pause_music",description:"Pause Spotify playback."},
  {name:"create_event",description:"Prepare a calendar event for the user to save.",parameters:{type:"OBJECT",properties:{title:{type:"STRING"},start:{type:"STRING",description:"Local start time, ISO 8601 like 2026-10-03T18:00:00"},end:{type:"STRING",description:"Local end time, same format (optional)"},description:{type:"STRING"},location:{type:"STRING"}},required:["title","start"]}}
]}];
const FAST=["play_song","pause_music","create_event"];
let hist=[],think=true;
function eventCard(a){
  const s=new Date(a.start);if(isNaN(s))return T("I couldn't read that date.","Δεν κατάλαβα την ημερομηνία.");
  let e=a.end?new Date(a.end):null;if(!e||isNaN(e)||e<=s)e=new Date(s.getTime()+36e5);
  const p=n=>String(n).padStart(2,"0"),q=encodeURIComponent;
  const f=d=>`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone,ds=a.description||"",lc=a.location||"";
  const g=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${q(a.title)}&dates=${f(s)}/${f(e)}&ctz=${q(tz)}&details=${q(ds)}&location=${q(lc)}`;
  const i=`intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/event;S.title=${q(a.title)};S.description=${q(ds)};S.eventLocation=${q(lc)};l.beginTime=${s.getTime()};l.endTime=${e.getTime()};end`;
  const d=document.createElement("div");d.className="ai";
  const bd=document.createElement("b");bd.textContent="📅 "+a.title+" — "+s.toLocaleString([],{dateStyle:"medium",timeStyle:"short"});
  d.append(bd,document.createElement("br"));
  [[i,T("Save to phone calendar","Αποθήκευση στο ημερολόγιο")],[g,"Google Calendar"]].forEach(([h,t])=>{const x=document.createElement("a");x.href=h;x.textContent=t;if(h===g)x.target="_blank";x.style.cssText="color:#3ab6ff;margin-right:14px";d.append(x)});
  $("log").prepend(d);
  return T("Event ready. Tap the card to save it.","Το event είναι έτοιμο. Πάτα την κάρτα για αποθήκευση.");
}
async function gem(){
  const now=new Date().toLocaleString("en-GB",{dateStyle:"full",timeStyle:"short"})+" ("+Intl.DateTimeFormat().resolvedOptions().timeZone+")";
  const body={systemInstruction:{parts:[{text:SYSTEM+" Current date and time: "+now+"."}]},tools:TOOLS,contents:hist,generationConfig:{maxOutputTokens:300}};
  if(think)body.generationConfig.thinkingConfig={thinkingLevel:"minimal"};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":S.get("gemini")},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok){if(think&&/think/i.test(j.error?.message||"")){think=false;return gem()}throw new Error(j.error?.message||r.status)}
  return j;
}
async function ask(text){
  if(hist.length>30)hist=[];
  hist.push({role:"user",parts:[{text}]});
  for(let i=0;i<5;i++){
    const j=await gem();
    const c=j.candidates?.[0]?.content;if(!c)return T("I have nothing to say to that.","Δεν έχω τι να πω γι' αυτό.");
    hist.push(c);
    const calls=(c.parts||[]).filter(p=>p.functionCall);
    if(!calls.length)return (c.parts||[]).map(p=>p.text||"").join(" ").trim()||"OK.";
    const res=[],outs=[];
    for(const p of calls){const f=p.functionCall;let out;try{out=await tools[f.name](f.args||{})}catch(e){out="Error: "+e.message}outs.push(out);res.push({functionResponse:{...(f.id?{id:f.id}:{}),name:f.name,response:{result:out}}})}
    hist.push({role:"user",parts:res});
    if(calls.every(p=>FAST.includes(p.functionCall.name))){const m=outs.join(" ");hist.push({role:"model",parts:[{text:m}]});return m}
  }
  return T("Apologies, that got tangled.","Συγγνώμη, μπερδεύτηκα.");
}

// ---------- Voice out ----------
async function speak(text){
  log("ai",text);
  const key=S.get("elKey"),voice=S.get("elVoice");
  if(key&&voice){
    try{
      const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice}?output_format=mp3_22050_32`,{method:"POST",headers:{"xi-api-key":key,"content-type":"application/json"},body:JSON.stringify({text,model_id:"eleven_flash_v2_5"})});
      if(r.ok){const a=new Audio(URL.createObjectURL(await r.blob()));await new Promise(res=>{a.onended=res;a.onerror=res;a.play().catch(res)});return}
    }catch(e){}
  }
  await new Promise(res=>{
    const gr=/[\u0370-\u03FF\u1F00-\u1FFF]/.test(text),L=gr?"el-GR":"en-GB";const u=new SpeechSynthesisUtterance(text);u.lang=L;u.pitch=gr?1:.8;
    const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").toLowerCase()==L.toLowerCase());if(v)u.voice=v;
    u.onend=res;u.onerror=res;speechSynthesis.speak(u);
  });
}

// ---------- Wake word + listening ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,listening=false,busy=false,awakeUntil=0,lang=S.get("lang")||"en-US";
function startRec(){
  if(!SR){status("Speech recognition unsupported. Use Chrome on Android.");return}
  rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang=lang;
  rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.trim();if(!busy)status(T("Heard: ","Άκουσα: ")+t);handle(t)};
  rec.onend=()=>{if(listening&&!busy)try{rec.lang=lang;rec.start()}catch(e){}};
  rec.onerror=e=>{if(e.error=="not-allowed"){listening=false;$("orb").className="";status("Microphone blocked. Allow it in site settings.")}};
  rec.start();
}
const norm=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/ς/g,"σ");
const WAKE=/jarvi[sz]?|jarvys|(?:ντ?)?(?:τζ|τσ|ζ|γι)[αε]ρ?β[ιηυ][σζ]?/;
async function handle(t){
  if(busy)return;
  const n=norm(t),m=WAKE.exec(n);
  let cmd=null;
  if(m){cmd=t.slice(m.index+m[0].length).replace(/^[\s,.!?;:-]+/,"").trim();if(!cmd){awakeUntil=Date.now()+8000;status(T("Yes?","Ναι;"));return}}
  else if(Date.now()<awakeUntil)cmd=t;
  if(!cmd)return;
  awakeUntil=0;busy=true;rec.stop();
  log("me",cmd);status("Thinking…");
  try{await speak(await ask(cmd))}catch(e){log("ai","Error: "+e.message);status("Error")}
  busy=false;status("Say “Jarvis…”");
  if(listening)try{rec.lang=lang;rec.start()}catch(e){}
}
$("orb").onclick=()=>{
  listening=!listening;$("orb").className=listening?"on":"";$("orb").textContent=listening?"Listening":"Tap to start";
  if(listening){startRec();status("Say “Jarvis…”")}else{rec&&rec.stop();status("Paused")}
};

const setLang=()=>$("langBtn").textContent=lang=="el-GR"?"Ακούω: Ελληνικά (πάτα για English)":"Listening: English (tap for Ελληνικά)";
$("langBtn").onclick=()=>{lang=lang=="el-GR"?"en-US":"el-GR";S.set("lang",lang);setLang();if(listening&&rec&&!busy)rec.stop()};
setLang();

// ---------- Settings ----------
const fields=["gemini","spotifyId","elKey","elVoice"];
fields.forEach(f=>$(f).value=S.get(f));
$("save").onclick=()=>{fields.forEach(f=>S.set(f,$(f).value.trim()));$("spstat").textContent="Saved."};
$("conn").onclick=()=>{fields.forEach(f=>S.set(f,$(f).value.trim()));spLogin()};
(async()=>{
  const code=new URLSearchParams(location.search).get("code");
  if(code){await tokenReq({grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:S.get("verifier")});history.replaceState({},"",REDIRECT)}
  $("spstat").textContent=S.get("spTok")?"Spotify connected.":"Spotify not connected.";
})();
</script></body></html>
