<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<style>
:root{--bg:#0a0f16;--card:#121a24;--line:#1f2d3d;--txt:#e8f1fb;--mut:#8196ab;--acc:#3ab6ff}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(120% 60% at 50% -10%,#10263a 0,var(--bg) 60%) fixed;color:var(--txt);min-height:100vh;padding:14px 16px 96px}
header{max-width:520px;margin:0 auto 8px;text-align:center;font-weight:700;letter-spacing:.35em;color:#9fd8ff;font-size:12px}
main{max-width:520px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.hero{display:flex;flex-direction:column;align-items:center;padding:14px 0 2px}
#orb{width:150px;height:150px;border-radius:50%;border:0;color:#cfeeff;font-size:15px;font-weight:600;background:radial-gradient(circle at 35% 30%,#2a7fb5,#0c2335 70%);box-shadow:0 0 0 2px #3ab6ff55,0 10px 40px #3ab6ff44}
#orb.on{animation:p 1.6s infinite}
@keyframes p{50%{box-shadow:0 0 0 6px #3ab6ff33,0 10px 60px #3ab6ff99}}
#status{margin-top:14px;color:var(--mut);font-size:14px;text-align:center}
.chip,.s{border:0;border-radius:12px;padding:10px 14px;background:#1b2a3a;color:var(--txt);font-weight:600;font-size:14px}
.primary{background:var(--acc);color:#04121c}
.s.ghost{background:transparent;color:var(--mut);padding:6px 10px}
.wide{width:100%;padding:14px;font-size:15px}
.chip{align-self:center;font-size:12px;color:var(--mut);padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
#log:empty{display:none}
#log{max-height:38vh;overflow-y:auto}
#log div{padding:7px 0;line-height:1.45;font-size:14px;border-bottom:1px solid var(--line)}
#log div:last-child{border:0}
.me{color:var(--mut)}.ai{color:var(--txt)}
details summary{font-weight:600;cursor:pointer}
input{width:100%;margin:6px 0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0d141c;color:var(--txt);font-size:14px}
input[type=range]{padding:0}input[type=checkbox]{width:auto;margin-right:8px}
label{display:block;margin:10px 0 2px;color:var(--mut);font-size:13px}
.lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.big{font-size:44px;font-weight:700;line-height:1.1;margin:4px 0}.big small{font-size:16px;color:var(--mut);font-weight:500}
.big2{font-size:30px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#0d141c;margin:12px 0 8px;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.item .grow{flex:1}.item small{display:block;color:var(--mut);font-size:12px}
.empty{padding-top:8px}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#0b121bd9;backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}
#nav button{flex:1;max-width:160px;border:0;background:transparent;color:var(--mut);font-size:20px;padding:6px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button span{font-size:11px;font-weight:600}
#nav button.on{color:var(--acc);background:#3ab6ff1a}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:8px;border-radius:9px;font-weight:600;font-size:14px}
.seg button.on{background:#1b2a3a;color:var(--txt)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;min-width:0}
.ch{font-weight:700;font-size:13px;color:var(--c);display:flex;justify-content:space-between}
.ch small{color:var(--mut);font-weight:600}
.tot{font-size:17px;font-weight:700;margin:2px 0 8px}
.xitem{border-top:1px solid var(--line);padding:7px 0;font-size:12.5px}
.xn{word-break:break-word}
.xb{display:flex;align-items:center;justify-content:space-between}
.xb small{color:var(--mut);font-size:10.5px}
.xb .s{padding:2px 6px;font-size:12px}
.np{text-align:center}
.np img{width:200px;height:200px;border-radius:16px;object-fit:cover;background:#0d141c;box-shadow:0 12px 40px #0008}
.mt{font-size:20px;font-weight:700;margin-top:12px}
.prog{height:5px;background:#0d141c;border-radius:9px;margin:14px 0 6px;overflow:hidden}
#mBar{height:100%;width:0;background:var(--acc)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:10px}
.round{width:64px;height:64px;border-radius:50%;font-size:24px;padding:0}
.s.on{color:var(--acc)}
.th{width:44px;height:44px;border-radius:8px;object-fit:cover}
.row input{margin:0}
</style></head><body>
<header>J.A.R.V.I.S</header>
<main>
<section id="mainView" class="view">
  <div class="seg" id="modeSeg"><button data-m="wake">🎙 Wake word</button><button data-m="tap">👆 Tap to talk</button><button data-m="text">⌨️ Type</button></div>
  <div class="seg" id="langSeg"><button data-l="el-GR">🇬🇷 Ελληνικά</button><button data-l="en-US">🇬🇧 English</button></div>
  <div id="repBanner" class="card" style="display:none;cursor:pointer"></div>
  <div class="hero" id="voiceBox"><button id="orb">Tap to start</button><div id="status">Tap the orb</div></div>
  <div id="typeBox" class="card" style="display:none"><div class="row"><input id="txt" placeholder="Write in Greek or English…"><button class="s primary" id="txtGo">Send</button></div></div>
  <div id="log" class="card"></div>
  <details class="card" id="alBox"><summary id="alSum">⏰ Alarms</summary><div id="alarms"></div></details>
  <details class="card"><summary>⚙️ Settings</summary>
    <input id="gemini" type="password" placeholder="Google Gemini API key">
    <input id="spotifyId" placeholder="Spotify Client ID">
    <input id="elKey" type="password" placeholder="ElevenLabs API key (optional)">
    <input id="elVoice" placeholder="ElevenLabs voice ID (optional)">
    <label>Voice speed <span id="spdv"></span></label><input type="range" id="speed" min="0.7" max="1.4" step="0.05">
    <label>Pause patience <span id="patv"></span></label><input type="range" id="patience" min="1" max="5" step="0.5">
    <label><input type="checkbox" id="natural">Natural voice (Gemini, free but limited)</label>
    <div class="btns" style="justify-content:flex-start;margin-top:8px"><button class="s primary" id="save">Save</button><button class="s" id="testBtn">Test voice</button><button class="s" id="conn">Connect Spotify</button></div>
    <div id="spstat" class="mut" style="margin-top:8px"></div>
  </details>
</section>
<section id="calView" class="view" style="display:none">
  <div class="card row"><button class="s" id="dPrev">◀</button><div id="dLbl" style="font-weight:700"></div><button class="s" id="dNext">▶</button></div>
  <div class="card"><div class="lbl">Today</div><div class="big"><span id="calTotal">0</span> <small>kcal</small></div><div id="calProt" class="mut"></div><div id="calBar" class="bar"></div><div id="calLegend" class="legend"></div></div>
  <div id="meals" class="view"></div>
  <div class="card"><div class="row"><div><div class="lbl">💧 Water</div><div class="big2"><span id="waterTotal">0</span> L</div></div><div class="btns"><button class="s primary" id="w250">+0.25 L</button><button class="s primary" id="w500">+0.5 L</button><button class="s ghost" id="wUndo">Undo</button></div></div></div>
  <div id="calHist"></div>
</section>
<section id="musicView" class="view" style="display:none">
  <div class="card np"><img id="mArt" alt="" style="visibility:hidden"><div id="mTitle" class="mt">—</div><div id="mArtist" class="mut"></div>
    <div class="prog"><div id="mBar"></div></div><div id="mTime" class="mut"></div>
    <div class="ctrl"><button class="s ghost" id="mShuf">🔀</button><button class="s" id="mPrev">⏮</button><button class="s primary round" id="mPlay">▶</button><button class="s" id="mNext">⏭</button><button class="s ghost" id="mRep">🔁</button></div></div>
  <div class="card"><div class="row"><input id="mQ" placeholder="Search song or artist"><button class="s primary" id="mGo">Search</button></div><div id="mRes"></div></div>
</section>
<section id="goalsView" class="view" style="display:none">
  <div class="card"><div class="lbl">Monthly goals</div>
    <label>Daily calories (kcal)</label><input id="g_kcal" type="number" inputmode="decimal">
    <label>Daily protein (g)</label><input id="g_protein" type="number" inputmode="decimal">
    <label>Daily water (L)</label><input id="g_water" type="number" step="0.1" inputmode="decimal">
    <label>Monthly budget (€)</label><input id="g_budget" type="number" inputmode="decimal">
    <label>Max "Wasted" per month (€)</label><input id="g_wasteMax" type="number" inputmode="decimal">
    <label>Other goals (used in the AI comment)</label><input id="g_notes" placeholder="e.g. less sugar, walk daily">
    <button class="s primary wide" id="g_save" style="margin-top:10px">Save goals</button></div>
  <div class="card"><div class="lbl">This month</div><div id="gProg"></div></div>
  <button class="s wide" id="repNow">📊 Generate today's report now</button>
  <div id="reports" class="view"></div>
</section>
<section id="expView" class="view" style="display:none">
  <div class="seg" id="perSeg"><button data-p="day">Today</button><button data-p="week">Week</button><button data-p="month">Month</button></div>
  <div class="card"><div class="lbl">Total spent</div><div class="big" id="expTotal">0.00€</div><div id="expSum" class="mut"></div><div id="expBar" class="bar"></div></div>
  <div class="cols">
    <div class="col"><div class="ch" style="--c:#4caf50">Needs<small id="p_needed"></small></div><div class="tot" id="t_needed"></div><div id="col_needed"></div></div>
    <div class="col"><div class="ch" style="--c:#f0b429">Wants<small id="p_okay"></small></div><div class="tot" id="t_okay"></div><div id="col_okay"></div></div>
    <div class="col"><div class="ch" style="--c:#ff5a5a">Wasted<small id="p_waste"></small></div><div class="tot" id="t_waste"></div><div id="col_waste"></div></div>
  </div>
  <button class="s primary wide" id="scanBtn">📷 Scan receipt</button>
  <input type="file" id="scanIn" accept="image/*" style="display:none">
  <div id="scanOut"></div>
</section>
</main>
<nav id="nav"><button id="tabJ" class="on">🎙<span>Jarvis</span></button><button id="tabM">🎵<span>Music</span></button><button id="tabC">🍽<span>Calories</span></button><button id="tabG">🎯<span>Goals</span></button><button id="tabE">💸<span>Expenses</span></button></nav>
<script>
const $=id=>document.getElementById(id);
const S={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const log=(w,t)=>{const d=document.createElement("div");d.className=w;d.textContent=(w=="me"?"You: ":"Jarvis: ")+t;$("log").prepend(d)};
const status=t=>$("status").textContent=t;

// ---------- Spotify (PKCE, no server) ----------
const REDIRECT=location.origin+location.pathname;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function spLogin(){
  const id=S.get("spotifyId");if(!id){alert("Save your Spotify Client ID first");return}
  const v=b64(crypto.getRandomValues(new Uint8Array(32)));S.set("verifier",v);
  const c=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  location=`https://accounts.spotify.com/authorize?${new URLSearchParams({client_id:id,response_type:"code",redirect_uri:REDIRECT,scope:"user-modify-playback-state user-read-playback-state playlist-read-private playlist-read-collaborative",code_challenge_method:"S256",code_challenge:c})}`;
}
async function tokenReq(p){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:S.get("spotifyId"),...p})});
  const j=await r.json();
  if(j.access_token){S.set("spTok",j.access_token);S.set("spExp",Date.now()+j.expires_in*1000-60000);if(j.refresh_token)S.set("spRef",j.refresh_token)}
}
async function spToken(){
  if(!S.get("spTok"))return null;
  if(Date.now()>+S.get("spExp"))await tokenReq({grant_type:"refresh_token",refresh_token:S.get("spRef")});
  return S.get("spTok");
}
async function sp(path,opt={}){
  const t=await spToken();if(!t)throw new Error("Spotify not connected");
  return fetch("https://api.spotify.com/v1"+path,{...opt,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"}});
}
const tools={
  async play_song({title,artist,query}){
    cands=(await findTracks(title||query||"",artist||"")).slice(0,6);ci=0;
    return cands.length?startTrack(cands[0]):T("No results for "+(title||query),"Δεν βρέθηκε: "+(title||query));
  },
  async play_songs({songs,play_now}){
    const found=[],miss=[];
    for(const q of songs||[]){const c=await findTracks(q.title||"",q.artist||"");c.length?found.push(c[0]):miss.push(q.title)}
    if(!found.length)return T("I couldn't find those songs.","Δεν βρήκα αυτά τα τραγούδια.");
    let i=0;
    if(play_now!==false){const m=await startTrack(found[0]);if(!musicOn)return m;i=1}
    for(;i<found.length;i++){const r=await sp("/me/player/queue?uri="+encodeURIComponent(found[i].uri),{method:"POST"});if(r.status==404)return T("No active Spotify device. Open the Spotify app and play anything once.","Δεν υπάρχει ενεργή συσκευή Spotify. Άνοιξε την εφαρμογή και παίξε κάτι μία φορά.")}
    playedNow=true;
    return T(`Queued ${found.length} songs`+(miss.length?`, couldn't find: ${miss.join(", ")}`:"")+".",`Μπήκαν στη σειρά ${found.length} τραγούδια`+(miss.length?`, δεν βρήκα: ${miss.join(", ")}`:"")+".");
  },
  async play_playlist({name}){
    const want=key(name||"");let uri=null,label="";
    try{const r=await sp("/me/playlists?limit=50");if(r.status==200){const p=(await r.json()).items.find(x=>x&&(key(x.name).includes(want)||want.includes(key(x.name))));if(p){uri=p.uri;label=p.name}}}catch(e){}
    if(!uri){const j=await (await sp("/search?"+new URLSearchParams({q:name,type:"playlist",limit:5}))).json();const p=(j.playlists?.items||[]).find(Boolean);if(p){uri=p.uri;label=p.name}}
    if(!uri)return T("I couldn't find that playlist.","Δεν βρήκα αυτό το playlist.");
    const r=await sp("/me/player/play",{method:"PUT",body:JSON.stringify({context_uri:uri})});
    if(r.status==404)return T("No active Spotify device. Open the Spotify app and play anything once.","Δεν υπάρχει ενεργή συσκευή Spotify. Άνοιξε την εφαρμογή και παίξε κάτι μία φορά.");
    musicOn=true;playedNow=true;return T(`Playing playlist ${label}.`,`Παίζει το playlist ${label}.`);
  },
  async resume_music(){await sp("/me/player/play",{method:"PUT"});musicOn=true;playedNow=true;return T("Resuming.","Συνεχίζω.")},
  remove_entry({kind,match,days_ago}){
    const exp=kind=="expense",f=exp?loadExp():loadFood(),want=words(match||""),ks=days_ago!=null?[dayKeyOff(+days_ago)]:Object.keys(f).sort().reverse().slice(0,30);
    for(const k of ks){const a=f[k]||[];for(let i=a.length-1;i>=0;i--){const dn=key(a[i].d);if(!want.length||want.some(w=>dn.includes(w))){const m=a.splice(i,1)[0];if(exp){saveExp(f);renderExp()}else{saveFood(f);renderFood()}return T(`Removed ${m.d} (${k}).`,`Αφαιρέθηκε: ${m.d} (${k}).`)}}}
    return T("I couldn't find that entry.","Δεν βρήκα αυτή την εγγραφή.");
  },
  async pause_music(){await sp("/me/player/pause",{method:"PUT"});musicOn=false;return T("Paused.","Σε παύση.")},
  create_event:a=>eventCard(a),
  log_expense({description,amount,category}){
    const arr=addExp(description,amount,category),m=arr[arr.length-1],t=sumExp(arr);
    return T(`Logged: ${m.d}, ${eur(m.a)} (${m.c}). Today: ${eur(t.all)}.`,`Καταγράφηκε: ${m.d}, ${eur(m.a)} (${CNAME()[m.c]}). Σήμερα: ${eur(t.all)}.`);
  },
  remove_last_expense(){
    const f=loadExp(),k=dayKey(),a=f[k]||[];if(!a.length)return T("Nothing to remove.","Δεν υπάρχει τίποτα να αφαιρεθεί.");
    const m=a.pop();f[k]=a;saveExp(f);renderExp();return T(`Removed ${m.d}.`,`Αφαιρέθηκε: ${m.d}.`);
  },
  async web_search({query,language}){return searchWeb(query,language)},
  set_alarm({time,label}){
    const d=new Date(time);if(isNaN(d)||d.getTime()<=Date.now())return T("I couldn't read that time.","Δεν κατάλαβα την ώρα.");
    const a=loadAl();a.push({ts:d.getTime(),label:String(label||"").slice(0,60)});saveAl(a);renderAl();keepAwake();(alarmCtx=alarmCtx||new AudioContext()).resume();
    const hm=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    return T(`Alarm set for ${hm}. Keep this page open with the screen on.`,`Το ξυπνητήρι ορίστηκε για τις ${hm}. Κράτα τη σελίδα ανοιχτή με την οθόνη αναμμένη.`);
  },
  cancel_alarms(){saveAl([]);renderAl();return T("All alarms cancelled.","Όλα τα ξυπνητήρια ακυρώθηκαν.")},
  log_meal({description,calories,protein_g,meal}){
    const f=loadFood(),k=dayKey(),a=f[k]||[];
    a.push({t:hm(),d:String(description||"").slice(0,80),k:Math.round(+calories||0),p:Math.round((+protein_g||0)*10)/10,m:MEALS.includes(meal)?meal:guessMeal()});
    f[k]=a;saveFood(f);renderFood();const t=totals(a),m=a[a.length-1];
    return T(`Logged for ${m.m}: ${m.d}, about ${m.k} kcal and ${m.p} g protein. Today so far: ${t.k} kcal, ${Math.round(t.p)} g protein.`,`Καταγράφηκε (${MNAME()[m.m]}): ${m.d}, περίπου ${m.k} kcal και ${m.p} g πρωτεΐνη. Σήμερα μέχρι τώρα: ${t.k} kcal, ${Math.round(t.p)} g πρωτεΐνη.`);
  },
  remove_last_meal(){
    const f=loadFood(),k=dayKey(),a=f[k]||[];
    if(!a.length)return T("There is nothing to remove today.","Δεν υπάρχει κάτι να αφαιρεθεί σήμερα.");
    const m=a.pop();f[k]=a;saveFood(f);renderFood();const t=totals(a);
    return T(`Removed ${m.d}. Today: ${t.k} kcal, ${Math.round(t.p)} g protein.`,`Αφαιρέθηκε: ${m.d}. Σήμερα: ${t.k} kcal, ${Math.round(t.p)} g πρωτεΐνη.`);
  },
  log_water({liters}){
    const l=+liters;if(!(l>0))return T("I couldn't read that amount.","Δεν κατάλαβα την ποσότητα.");
    const tot=addWater(l);return T(`Added ${l} L. Water today: ${tot} L.`,`Προστέθηκαν ${l} L. Νερό σήμερα: ${tot} L.`);
  }
};

const GRM={α:"a",β:"v",γ:"g",δ:"d",ε:"e",ζ:"z",η:"i",θ:"th",ι:"i",κ:"k",λ:"l",μ:"m",ν:"n",ξ:"x",ο:"o",π:"p",ρ:"r",σ:"s",τ:"t",υ:"i",φ:"f",χ:"ch",ψ:"ps",ω:"o"};
const key=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/ς/g,"σ").replace(/[^\p{L}\p{N} ]/gu," ")
  .replace(/ου/g,"u").replace(/αι/g,"e").replace(/ει|οι|υι/g,"i").replace(/μπ/g,"b").replace(/ντ/g,"d").replace(/γκ/g,"g").replace(/τσ/g,"ts")
  .replace(/[α-ω]/g,c=>GRM[c]||c)
  .replace(/ou/g,"u").replace(/ai/g,"e").replace(/ei|oi|ee|y/g,"i").replace(/ph/g,"f").replace(/kh|ch/g,"h").replace(/(.)\1+/g,"$1").replace(/\s+/g," ").trim();
const words=x=>{const w=key(x).split(" ").filter(Boolean),l=w.filter(q=>q.length>2);return [...new Set(l.length?l:w)]};
let cands=[],ci=0;
async function startTrack(t){
  const p=await sp("/me/player/play",{method:"PUT",body:JSON.stringify({uris:[t.uri]})});
  if(p.status==404)return T("No active Spotify device. Open the Spotify app, play anything once, then retry.","Δεν υπάρχει ενεργή συσκευή Spotify. Άνοιξε την εφαρμογή, παίξε ένα τραγούδι και ξαναδοκίμασε.");
  if(p.status==403)return T("Spotify refused. Premium is required.","Το Spotify αρνήθηκε. Χρειάζεται Premium.");
  musicOn=true;playedNow=true;
  return T(`Now playing ${t.name} by ${t.artists[0].name}.`,`Παίζει τώρα: ${t.name} από ${t.artists[0].name}.`);
}
async function findTracks(title,artist){
  const tk=words(title),ak=words(artist),kt=key(title),map=new Map();
  const qs=[artist?`track:${title} artist:${artist}`:`track:${title}`,`${title} ${artist}`.trim(),`${kt} ${key(artist)}`.trim()];
  for(const q of qs){
    const r=await sp("/search?"+new URLSearchParams({q,type:"track",limit:10}));
    for(const t of (await r.json()).tracks?.items||[]){
      const tn=key(t.name),an=key(t.artists.map(a=>a.name).join(" "));
      const sc=(tk.length?tk.filter(w=>tn.includes(w)).length/tk.length:0)*2+(ak.length?ak.filter(w=>an.includes(w)).length/ak.length:0)+(tn==kt?1:0)+(t.popularity||0)/1000;
      map.set(t.uri,{t,sc});
    }
    if([...map.values()].some(v=>v.sc>=2.9+(ak.length?1:0)))break;
  }
  return [...map.values()].sort((a,b)=>b.sc-a.sc).map(v=>v.t);
}

const monthDays=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+1,0).getDate()};
function dayStats(k){
  const a=loadFood()[k]||[],t=totals(a),e=sumExp(loadExp()[k]||[]);
  return {k:t.k,p:Math.round(t.p),w:waterSum(loadWater()[k]||[]),spent:Math.round(e.all*100)/100,needs:e.needed,wants:e.okay,waste:e.waste,meals:a.length};
}
function scoreDay(st,g){
  const parts=[],cl=x=>Math.max(0,Math.min(1,x));
  if(+g.kcal>0){const r=st.k/g.kcal;parts.push(st.k?cl(r>=.9&&r<=1.1?1:1-Math.abs(r-1)*2.5):0)}
  if(+g.protein>0)parts.push(cl(st.p/g.protein));
  if(+g.water>0)parts.push(cl(st.w/g.water));
  if(+g.budget>0){const al=g.budget/monthDays();parts.push(st.spent<=al?1:cl(1-(st.spent/al-1)))}
  if(+g.wasteMax>0){const al=g.wasteMax/monthDays();parts.push(st.waste<=al?1:cl(1-(st.waste/al-1)/2))}
  return parts.length?Math.round(1+19*parts.reduce((o,x)=>o+x,0)/parts.length):null;
}

const norm=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/ς/g,"σ");
const WAKE=/\b(?:jarvi[sz]?|jarvys|jarvas|jervis|gervais|yaris|yarvis|service|travis|garvis|darvis|charvis|harvis)\b|(?:ντ?)?(?:τζ|τσ|ζ|γι)[αε]ρ?β[ιηυ][σζ]?/;
function chime(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12);setTimeout(()=>c.close(),500)}catch(e){}}
const restartRec=()=>{if(listening)try{rec.lang=lang;rec.start()}catch(e){}};
async function handle(t,conf){
  if(busy)return;
  const m0=WAKE.exec(norm(t)),m=m0&&m0.index<=12?m0:null;
  if(!m)return;
  const cmd=t.slice(m.index+m[0].length).replace(/^[\s,.!?;:-]+/,"").trim();
  busy=true;rec.stop();keepMusic();
  try{
    let ans;
    if(cmd.split(/\s+/).length>=2&&(conf||0)>=.85){uiLang=lang=="el-GR"?"el":"en";log("me",cmd);status(T("Thinking…","Σκέφτομαι…"));ans=await ask(cmd)}
    else{
      await sleep(250);chime();status(T("Listening…","Ακούω…"));
      const a=await recordAudio();keepMusic();
      if(!a){busy=false;status(T("Say “Jarvis…”","Πες «Jarvis…»"));restartRec();return}
      log("me","🎤");status(T("Thinking…","Σκέφτομαι…"));ans=await ask("",a);
    }
    await reply(ans);
  }catch(e){log("ai","Error: "+e.message)}
  busy=false;status(T("Say “Jarvis…”","Πες «Jarvis…»"));restartRec();
}
const toggleWake=()=>{
  listening=!listening;$("orb").className=listening?"on":"";$("orb").textContent=listening?"Listening":"Tap to start";
  if(listening){startRec();status("Say “Jarvis…”")}else{rec&&rec.stop();status("Paused")}
};
let recording=false,mode=S.get("mode2")||"wake";
$("orb").onclick=async()=>{
  if(mode!="tap")return toggleWake();
  if(busy)return;
  if(recording){stopRec&&stopRec();return}
  recording=true;$("orb").className="on";status(T("Listening… (tap to finish)","Ακούω… (πάτα για να τελειώσεις)"));
  let a;
  try{a=await recordAudio()}catch(e){recording=false;$("orb").className="";status(T("Microphone blocked. Allow it in site settings.","Το μικρόφωνο μπλοκαρίστηκε. Επέτρεψέ το στις ρυθμίσεις του site."));return}
  recording=false;$("orb").className="";
  keepMusic();
  if(!a){status(T("I didn't hear anything. Tap and speak.","Δεν άκουσα τίποτα. Πάτα και μίλα."));return}
  busy=true;uiLang=lang=="el-GR"?"el":"en";log("me","🎤");status(T("Thinking…","Σκέφτομαι…"));
  try{await reply(await ask("",a))}catch(e){log("ai","Error: "+e.message);status("Error")}
  busy=false;status(T("Tap and speak","Πάτα και μίλα"));
};

const setMode=()=>{
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.m==mode));
  document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("on",b.dataset.l==lang));
  $("voiceBox").style.display=mode=="text"?"none":"flex";$("typeBox").style.display=mode=="text"?"block":"none";$("langSeg").style.display=mode=="text"?"none":"flex";
  $("orb").textContent=mode=="tap"?T("Tap & speak","Πάτα & μίλα"):T("Tap to start","Πάτα για έναρξη");
  status(mode=="tap"?T("Tap, speak, tap again","Πάτα, μίλα, πάτα ξανά"):mode=="wake"?T("Tap once, then say “Jarvis…”","Πάτα μία φορά και μετά πες «Jarvis…»"):"");
};
const stopListening=()=>{if(listening){listening=false;rec&&rec.stop()}$("orb").className=""};
document.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{stopListening();mode=b.dataset.m;S.set("mode2",mode);setMode()});
document.querySelectorAll("#langSeg button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;S.set("lang",lang);uiLang=lang=="el-GR"?"el":"en";if(listening&&rec&&!busy)rec.stop();setMode();renderFood();renderExp();renderAl();renderGoals()});
async function sendText(){
  const v=$("txt").value.trim();if(!v||busy)return;$("txt").value="";
  busy=true;uiLang=/[\u0370-\u03FF]/.test(v)?"el":"en";log("me",v);
  try{log("ai",await ask(v))}catch(e){log("ai","Error: "+e.message)}
  busy=false;keepMusic();
}
$("txtGo").onclick=sendText;$("txt").onkeydown=e=>{if(e.key=="Enter")sendText()};
uiLang=lang=="el-GR"?"el":"en";
setMode();renderFood();renderExp();renderAl();keepAwake();renderGoals();
GF.forEach(f=>$("g_"+f).value=loadGoals()[f]??"");
{const y=dayKeyOff(1),sy=dayStats(y);if(!loadRep().some(r=>r.d==y)&&(sy.meals||sy.spent>0||sy.w>0))makeReport(y,true)}

// ---------- Settings ----------
const fields=["gemini","spotifyId","elKey","elVoice"];
fields.forEach(f=>$(f).value=S.get(f));
$("natural").checked=S.get("natural")!=="0";$("natural").onchange=()=>S.set("natural",$("natural").checked?"1":"0");
$("speed").value=S.get("speed")||"1";$("spdv").textContent=$("speed").value+"×";$("speed").oninput=()=>{S.set("speed",$("speed").value);$("spdv").textContent=$("speed").value+"×"};
$("patience").value=S.get("patience")||"2.5";$("patv").textContent=$("patience").value+"s";$("patience").oninput=()=>{S.set("patience",$("patience").value);$("patv").textContent=$("patience").value+"s"};
$("save").onclick=()=>{fields.forEach(f=>S.set(f,$(f).value.trim()));$("spstat").textContent="Saved."};
$("conn").onclick=()=>{fields.forEach(f=>S.set(f,$(f).value.trim()));spLogin()};
$("testBtn").onclick=()=>{fields.forEach(f=>S.set(f,$(f).value.trim()));speak(T("At your service.","Στη διάθεσή σας."))};
(async()=>{
  const code=new URLSearchParams(location.search).get("code");
  if(code){await tokenReq({grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:S.get("verifier")});history.replaceState({},"",REDIRECT)}
  $("spstat").textContent=S.get("spTok")?"Spotify connected.":"Spotify not connected.";
})();
</script></body></html>
