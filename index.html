<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1118;color:#cfe8ff;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
#orb{width:140px;height:140px;border-radius:50%;border:2px solid #3ab6ff;background:radial-gradient(#0f3550,#0b1118);color:#8fd3ff;font-size:16px;margin:24px 0 12px;box-shadow:0 0 30px #3ab6ff55}

</style></head><body>
<div id="tabs"><button class="s" id="tabJ">Jarvis</button><button class="s" id="tabE">💸 Έξοδα</button></div>
<div id="mainView" class="view">
<button id="orb">Tap to start</button>
<button class="s" id="modeBtn"></button>

<details id="alBox"><summary id="alSum">⏰ Alarms</summary><div id="alarms"></div></details>
<details><summary>Settings</summary>
<input id="gemini" type="password" placeholder="Google Gemini API key">
<input id="spotifyId" placeholder="Spotify Client ID">
<input id="elKey" type="password" placeholder="ElevenLabs API key (optional)">
<input id="elVoice" placeholder="ElevenLabs voice ID (optional)">

<button class="s" id="save">Save</button><button class="s" id="testBtn">Test voice</button><button class="s" id="conn">Connect Spotify</button>
<div id="spstat"></div></details>
</div>
<div id="expView" class="view" style="display:none">
<div id="expSum" style="margin:12px 0;font-size:17px;text-align:center"></div>
<button class="s" id="scanBtn">📷 Σάρωση απόδειξης</button>
<input type="file" id="scanIn" accept="image/*" style="display:none">
<div id="scanOut" style="width:100%;max-width:480px"></div>
<div id="expList" style="width:100%;max-width:480px;margin-top:8px"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const S={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const log=(w,t)=>{const d=document.createElement("div");d.className=w;d.textContent=(w=="me"?"You: ":"Jarvis: ")+t;$("log").prepend(d)};
const status=t=>$("status").textContent=t;

// ---------- Spotify (PKCE, no server) ----------
const REDIRECT=location.origin+location.pathname;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function spLogin(){
  const id=S.get("spotifyId");if(!id){alert("Save your Spotify Client ID first");return}
  const v=b64(crypto.getRandomValues(new Uint8Array(32)));S.set("verifier",v);
  const c=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  location=`https://accounts.spotify.com/authorize?${new URLSearchParams({client_id:id,response_type:"code",redirect_uri:REDIRECT,scope:"user-modify-playback-state user-read-playback-state",code_challenge_method:"S256",code_challenge:c})}`;
}
async function tokenReq(p){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:S.get("spotifyId"),...p})});
  const j=await r.json();
  if(j.access_token){S.set("spTok",j.access_token);S.set("spExp",Date.now()+j.expires_in*1000-60000);if(j.refresh_token)S.set("spRef",j.refresh_token)}
}
async function spToken(){
  if(!S.get("spTok"))return null;
  if(Date.now()>+S.get("spExp"))await tokenReq({grant_type:"refresh_token",refresh_token:S.get("spRef")});
  return S.get("spTok");
}
async function sp(path,opt={}){
  const t=await spToken();if(!t)throw new Error("Spotify not connected");
  return fetch("https://api.spotify.com/v1"+path,{...opt,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"}});
}
const tools={
  async play_song({title,artist,query}){
    title=title||query||"";artist=artist||"";
    const tk=words(title),ak=words(artist),kt=key(title),map=new Map();
    const qs=[artist?`track:${title} artist:${artist}`:`track:${title}`,`${title} ${artist}`.trim(),`${kt} ${key(artist)}`.trim()];
    for(const q of qs){
      const r=await sp("/search?"+new URLSearchParams({q,type:"track",limit:10}));
      for(const t of (await r.json()).tracks?.items||[]){
        const tn=key(t.name),an=key(t.artists.map(a=>a.name).join(" "));
        const sc=(tk.length?tk.filter(w=>tn.includes(w)).length/tk.length:0)*2+(ak.length?ak.filter(w=>an.includes(w)).length/ak.length:0)+(tn==kt?1:0)+(t.popularity||0)/1000;
        map.set(t.uri,{t,sc});
      }
      if([...map.values()].some(v=>v.sc>=2.9+(ak.length?1:0)))break;
    }
    cands=[...map.values()].sort((a,b)=>b.sc-a.sc).slice(0,6).map(v=>v.t);ci=0;
    return cands.length?startTrack(cands[0]):T("No results for "+title,"Δεν βρέθηκε: "+title);
  },
  async play_next_match(){
    if(++ci>=cands.length)return T("I have no other matches.","Δεν έχω άλλες επιλογές.");
    return startTrack(cands[ci]);
  },
  async pause_music(){await sp("/me/player/pause",{method:"PUT"});musicOn=false;return T("Paused.","Σε παύση.")},
  create_event:a=>eventCard(a),
  log_expense({description,amount,category}){
    const arr=addExp(description,amount,category),m=arr[arr.length-1],t=sumExp(arr);
    return T(`Logged: ${m.d}, ${eur(m.a)} (${m.c}). Today: ${eur(t.all)}.`,`Καταγράφηκε: ${m.d}, ${eur(m.a)} (${CNAME()[m.c]}). Σήμερα: ${eur(t.all)}.`);
  },
  remove_last_expense(){
    const f=loadExp(),k=dayKey(),a=f[k]||[];if(!a.length)return T("Nothing to remove.","Δεν υπάρχει τίποτα να αφαιρεθεί.");
    const m=a.pop();f[k]=a;saveExp(f);renderExp();return T(`Removed ${m.d}.`,`Αφαιρέθηκε: ${m.d}.`);
  },
  async web_search({query,language}){return searchWeb(query,language)},
  set_alarm({time,label}){
    const d=new Date(time);if(isNaN(d)||d.getTime()<=Date.now())return T("I couldn't read that time.","Δεν κατάλαβα την ώρα.");
    const a=loadAl();a.push({ts:d.getTime(),label:String(label||"").slice(0,60)});saveAl(a);renderAl();keepAwake();(alarmCtx=alarmCtx||new AudioContext()).resume();
    const hm=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    return T(`Alarm set for ${hm}. Keep this page open with the screen on.`,`Το ξυπνητήρι ορίστηκε για τις ${hm}. Κράτα τη σελίδα ανοιχτή με την οθόνη αναμμένη.`);
  },
  cancel_alarms(){saveAl([]);renderAl();return T("All alarms cancelled.","Όλα τα ξυπνητήρια ακυρώθηκαν.")},
  log_meal({description,calories,protein_g}){
    const f=loadFood(),k=dayKey(),n=new Date(),a=f[k]||[];
    a.push({t:String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),d:String(description||"").slice(0,80),k:Math.round(+calories||0),p:Math.round((+protein_g||0)*10)/10});
    f[k]=a;saveFood(f);renderFood();const t=totals(a),m=a[a.length-1];
    return T(`Logged: ${m.d}, about ${m.k} kcal and ${m.p} g protein. Today so far: ${t.k} kcal, ${Math.round(t.p)} g protein.`,`Καταγράφηκε: ${m.d}, περίπου ${m.k} kcal και ${m.p} g πρωτεΐνη. Σήμερα μέχρι τώρα: ${t.k} kcal, ${Math.round(t.p)} g πρωτεΐνη.`);
  },
  remove_last_meal(){
    const f=loadFood(),k=dayKey(),a=f[k]||[];
    if(!a.length)return T("There is nothing to remove today.","Δεν υπάρχει κάτι να αφαιρεθεί σήμερα.");
    const m=a.pop();f[k]=a;saveFood(f);renderFood();const t=totals(a);
    return T(`Removed ${m.d}. Today: ${t.k} kcal, ${Math.round(t.p)} g protein.`,`Αφαιρέθηκε: ${m.d}. Σήμερα: ${t.k} kcal, ${Math.round(t.p)} g πρωτεΐνη.`);
  }
};

const GRM={α:"a",β:"v",γ:"g",δ:"d",ε:"e",ζ:"z",η:"i",θ:"th",ι:"i",κ:"k",λ:"l",μ:"m",ν:"n",ξ:"x",ο:"o",π:"p",ρ:"r",σ:"s",τ:"t",υ:"i",φ:"f",χ:"ch",ψ:"ps",ω:"o"};
const key=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/ς/g,"σ").replace(/[^\p{L}\p{N} ]/gu," ")
  .replace(/ου/g,"u").replace(/αι/g,"e").replace(/ει|οι|υι/g,"i").replace(/μπ/g,"b").replace(/ντ/g,"d").replace(/γκ/g,"g").replace(/τσ/g,"ts")
  .replace(/[α-ω]/g,c=>GRM[c]||c)
  .replace(/ou/g,"u").replace(/ai/g,"e").replace(/ei|oi|ee|y/g,"i").replace(/ph/g,"f").replace(/kh|ch/g,"h").replace(/(.)\1+/g,"$1").replace(/\s+/g," ").trim();
const words=x=>{const w=key(x).split(" ").filter(Boolean),l=w.filter(q=>q.length>2);return [...new Set(l.length?l:w)]};
let cands=[],ci=0;
async function startTrack(t){
  const p=await sp("/me/player/play",{method:"PUT",body:JSON.stringify({uris:[t.uri]})});
  if(p.status==404)return T("No active Spotify device. Open the Spotify app, play anything once, then retry.","Δεν υπάρχει ενεργή συσκευή Spotify. Άνοιξε την εφαρμογή, παίξε ένα τραγούδι και ξαναδοκίμασε.");
  if(p.status==403)return T("Spotify refused. Premium is required.","Το Spotify αρνήθηκε. Χρειάζεται Premium.");
  musicOn=true;playedNow=true;
  return T(`Now playing ${t.name} by ${t.artists[0].name}.`,`Παίζει τώρα: ${t.name} από ${t.artists[0].name}.`);
}
let musicOn=false,playedNow=false;
async function keepMusic(){
  if(!musicOn)return;
  try{await sleep(600);const r=await sp("/me/player");if(r.status==200&&!(await r.json()).is_playing)await sp("/me/player/play",{method:"PUT"})}catch(e){}
}
async function reply(r){if(playedNow){playedNow=false;log("ai",r)}else await speak(r);await keepMusic()}

// ---------- Food log ----------
const dayKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const loadFood=()=>{try{return JSON.parse(S.get("food")||"{}")}catch(e){return {}}};
const saveFood=f=>S.set("food",JSON.stringify(f));
const totals=a=>a.reduce((o,m)=>({k:o.k+m.k,p:o.p+m.p}),{k:0,p:0});
function renderFood(){
  const f=loadFood(),today=f[dayKey()]||[],t=totals(today),box=$("food");box.textContent="";
  $("foodSum").textContent=`🍽 ${T("Food log","Σημειωματάριο")} — ${t.k} kcal · ${Math.round(t.p)} g ${T("protein","πρωτεΐνη")}`;
  today.forEach((m,i)=>{const r=document.createElement("div");r.textContent=`${m.t} — ${m.d} · ${m.k} kcal · ${m.p} g `;const x=document.createElement("button");x.textContent="✕";x.className="s";x.style.padding="2px 8px";x.onclick=()=>{today.splice(i,1);f[dayKey()]=today;saveFood(f);renderFood()};r.append(x);box.append(r)});
  Object.keys(f).filter(k=>k!=dayKey()).sort().reverse().slice(0,7).forEach(k=>{const tt=totals(f[k]),r=document.createElement("div");r.className="me";r.textContent=`${k}: ${tt.k} kcal · ${Math.round(tt.p)} g`;box.append(r)});
}
function foodNote(){
  const a=loadFood()[dayKey()]||[],t=totals(a);
  return ` Food log today: ${t.k} kcal, ${Math.round(t.p)} g protein`+(a.length?" ("+a.map(m=>`${m.d}: ${m.k} kcal`).join("; ")+")":"")+".";
}

// ---------- Alarms (ring only while this page is open) ----------
let alarmCtx,ringing=null,wl=null;
const loadAl=()=>{try{return JSON.parse(S.get("alarms")||"[]")}catch(e){return []}};
const saveAl=a=>S.set("alarms",JSON.stringify(a));
function renderAl(){
  const a=loadAl().sort((x,y)=>x.ts-y.ts),box=$("alarms");box.textContent="";
  $("alSum").textContent=`⏰ ${T("Alarms","Ξυπνητήρια")} (${a.length})`;
  a.forEach(m=>{const r=document.createElement("div");r.textContent=new Date(m.ts).toLocaleString([],{weekday:"short",hour:"2-digit",minute:"2-digit"})+(m.label?" — "+m.label:"")+" ";const x=document.createElement("button");x.textContent="✕";x.className="s";x.style.padding="2px 8px";x.onclick=()=>{saveAl(loadAl().filter(q=>q.ts!==m.ts));renderAl()};r.append(x);box.append(r)});
}
async function keepAwake(){try{if(loadAl().length&&!wl){wl=await navigator.wakeLock.request("screen");wl.onrelease=()=>{wl=null}}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible")keepAwake()});
function ring(m){
  ringing=m;const ctx=alarmCtx=alarmCtx||new AudioContext();ctx.resume();
  const beep=()=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.4;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.25)};
  const iv=setInterval(()=>{beep();setTimeout(beep,350);navigator.vibrate&&navigator.vibrate([400,200,400])},1500);
  const b=document.createElement("button");b.style.cssText="position:fixed;inset:0;z-index:9;font-size:28px;background:#ff5a5a;color:#fff;border:0";
  b.textContent="⏰ "+(m.label||T("Alarm","Ξυπνητήρι"))+" — "+T("tap to stop","πάτα για να σταματήσει");
  b.onclick=()=>{clearInterval(iv);b.remove();ringing=null};document.body.append(b);
}
setInterval(()=>{
  if(ringing)return;const now=Date.now(),a=loadAl(),past=a.filter(m=>m.ts<=now);
  if(past.length){saveAl(a.filter(m=>m.ts>now));renderAl();const live=past.filter(m=>now-m.ts<300000);if(live.length)ring(live[0])}
},1000);

// ---------- Expenses ----------
const CATS={needed:"#4caf50",okay:"#f0b429",waste:"#ff5a5a"};
const CNAME=()=>({needed:T("Needed","Απαραίτητο"),okay:"Okay",waste:T("Waste","Σπατάλη")});
const loadExp=()=>{try{return JSON.parse(S.get("exp")||"{}")}catch(e){return {}}};
const saveExp=f=>S.set("exp",JSON.stringify(f));
const sumExp=a=>{const o={needed:0,okay:0,waste:0,all:0};a.forEach(m=>{o[m.c]=(o[m.c]||0)+m.a;o.all+=m.a});return o};
const eur=n=>(Math.round(n*100)/100).toFixed(2)+"€";
function renderExp(){
  const f=loadExp(),k=dayKey(),a=f[k]||[],t=sumExp(a),box=$("expList"),N=CNAME();box.textContent="";
  $("expSum").textContent=`${T("Today","Σήμερα")}: ${eur(t.all)} — ${N.needed} ${eur(t.needed)} · Okay ${eur(t.okay)} · ${N.waste} ${eur(t.waste)}`;
  a.forEach((m,i)=>{
    const r=document.createElement("div");r.style.cssText="padding:6px 0;border-bottom:1px solid #1d2a36";
    const b=document.createElement("button");b.textContent=N[m.c];b.className="s";b.style.cssText=`background:${CATS[m.c]};padding:3px 8px;font-size:12px`;
    b.onclick=()=>{const o=["needed","okay","waste"];m.c=o[(o.indexOf(m.c)+1)%3];saveExp(f);renderExp()};
    const x=document.createElement("button");x.textContent="✕";x.className="s";x.style.padding="3px 8px";x.onclick=()=>{a.splice(i,1);f[k]=a;saveExp(f);renderExp()};
    r.append(`${m.t} — ${m.d} · ${eur(m.a)} `,b,x);box.append(r);
  });
  Object.keys(f).filter(d=>d!=k).sort().reverse().slice(0,7).forEach(d=>{const q=sumExp(f[d]),r=document.createElement("div");r.className="me";r.textContent=`${d}: ${eur(q.all)} (needed ${eur(q.needed)} · okay ${eur(q.okay)} · waste ${eur(q.waste)})`;box.append(r)});
}
function addExp(d,a,c){const f=loadExp(),k=dayKey(),n=new Date(),arr=f[k]||[];arr.push({t:String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),d:String(d||"").slice(0,80),a:Math.round((+a||0)*100)/100,c:CATS[c]?c:"okay"});f[k]=arr;saveExp(f);renderExp();return arr}
function expNote(){const a=loadExp()[dayKey()]||[],t=sumExp(a);return ` Expenses today: ${eur(t.all)} (needed ${eur(t.needed)}, okay ${eur(t.okay)}, waste ${eur(t.waste)})`+(a.length?" ("+a.map(m=>`${m.d} ${m.a}€ ${m.c}`).join("; ")+")":"")+"."}
const GURL=m=>`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`;
async function searchWeb(query,language){
  const r=await fetch(GURL("gemini-flash-latest"),{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":S.get("gemini")},body:JSON.stringify({contents:[{role:"user",parts:[{text:`Answer in ${String(language).startsWith("el")?"Greek":"English"}, in at most 2 short spoken sentences, no markdown: ${query}`}]}],tools:[{google_search:{}}],generationConfig:{maxOutputTokens:300}})});
  const j=await r.json();
  if(!r.ok)return T("Search failed: ","Η αναζήτηση απέτυχε: ")+String(j.error?.message||r.status).slice(0,80);
  return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join(" ").trim()||T("I found nothing.","Δεν βρήκα κάτι.");
}
const RECEIPT='Read this receipt. Return JSON only: {"merchant":string,"total":number,"items":[{"name":string,"price":number,"category":"needed"|"okay"|"waste"}]}. Prices are numbers in euros (line total per item). Categorize each item: needed = necessities (groceries, bills, transport, health), okay = reasonable extras, waste = impulsive or unnecessary (sweets, snacks, unneeded things). Keep item names in the receipt language. If items are unreadable, return one item named after the merchant with the total.';
function showScan(d){
  const out=$("scanOut");out.textContent="";
  const items=(d.items||[]).filter(i=>+i.price>0).map(i=>({d:(d.merchant?d.merchant+": ":"")+i.name,a:+i.price,c:CATS[i.category]?i.category:"okay"}));
  const sum=items.reduce((o,i)=>o+i.a,0);
  if(+d.total>0&&sum<d.total-.05)items.push({d:(d.merchant||T("Receipt","Απόδειξη"))+": "+T("other/unlisted","λοιπά"),a:Math.round((d.total-sum)*100)/100,c:"okay"});
  if(!items.length){out.textContent=T("I couldn't read any items.","Δεν διάβασα προϊόντα.");return}
  const box=document.createElement("div");box.style.cssText="border:1px solid #28445a;border-radius:8px;padding:8px;margin:8px 0";
  items.forEach(i=>{const r=document.createElement("div");r.textContent=`${i.d} — ${eur(i.a)} — ${CNAME()[i.c]}`;box.append(r)});
  const ok=document.createElement("button"),no=document.createElement("button");ok.className=no.className="s";
  ok.textContent=T("Add all","Προσθήκη όλων")+" ("+eur(items.reduce((o,i)=>o+i.a,0))+")";no.textContent=T("Cancel","Ακύρωση");
  ok.onclick=()=>{items.forEach(i=>addExp(i.d,i.a,i.c));out.textContent=T("Added.","Προστέθηκε.")};no.onclick=()=>{out.textContent=""};
  box.append(ok,no);out.append(box);
}
$("scanBtn").onclick=()=>$("scanIn").click();
$("scanIn").onchange=async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;
  const out=$("scanOut");out.textContent=T("Reading receipt…","Διαβάζω την απόδειξη…");
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
    const sc=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const data=c.toDataURL("image/jpeg",.8).split(",")[1];
    const r=await fetch(GURL("gemini-flash-latest"),{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":S.get("gemini")},body:JSON.stringify({contents:[{role:"user",parts:[{inlineData:{mimeType:"image/jpeg",data}},{text:RECEIPT}]}],generationConfig:{responseMimeType:"application/json",maxOutputTokens:2000}})});
    const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
    const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
    showScan(JSON.parse(txt.replace(/```json|```/g,"").trim()));
  }catch(err){out.textContent="⚠ "+err.message}
};
