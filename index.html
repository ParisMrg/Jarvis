<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1118;color:#cfe8ff;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
#orb{width:140px;height:140px;border-radius:50%;border:2px solid #3ab6ff;background:radial-gradient(#0f3550,#0b1118);color:#8fd3ff;font-size:16px;margin:24px 0 12px;box-shadow:0 0 30px #3ab6ff55}
#orb.on{animation:p 1.6s infinite}
@keyframes p{50%{box-shadow:0 0 55px #3ab6ffaa}}
#status{margin-bottom:12px;color:#8fd3ff}
#log{width:100%;max-width:480px;flex:1;overflow-y:auto}
#log div{padding:6px 0;line-height:1.4}.me{color:#9fb3c4}.ai{color:#fff}
details{width:100%;max-width:480px;margin-top:12px}
input{width:100%;box-sizing:border-box;margin:4px 0;padding:10px;border-radius:8px;border:1px solid #28445a;background:#101c27;color:#fff}
button.s{padding:10px 14px;margin:4px 4px 0 0;border-radius:8px;border:0;background:#3ab6ff;color:#06121c;font-weight:600}
</style></head><body>
<button id="orb">Tap to start</button>
<div id="status">Tap the orb, then say “Jarvis…”</div>
<div id="log"></div>
<details><summary>Settings</summary>
<input id="anthropic" type="password" placeholder="Anthropic API key">
<input id="spotifyId" placeholder="Spotify Client ID">
<input id="elKey" type="password" placeholder="ElevenLabs API key (optional)">
<input id="elVoice" placeholder="ElevenLabs voice ID (optional)">
<button class="s" id="save">Save</button><button class="s" id="conn">Connect Spotify</button>
<div id="spstat"></div></details>
<script>
const $=id=>document.getElementById(id);
const S={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const log=(w,t)=>{const d=document.createElement("div");d.className=w;d.textContent=(w=="me"?"You: ":"Jarvis: ")+t;$("log").prepend(d)};
const status=t=>$("status").textContent=t;

// ---------- Spotify (PKCE, no server) ----------
const REDIRECT=location.origin+location.pathname;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function spLogin(){
  const id=S.get("spotifyId");if(!id){alert("Save your Spotify Client ID first");return}
  const v=b64(crypto.getRandomValues(new Uint8Array(32)));S.set("verifier",v);
  const c=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  location=`https://accounts.spotify.com/authorize?${new URLSearchParams({client_id:id,response_type:"code",redirect_uri:REDIRECT,scope:"user-modify-playback-state user-read-playback-state",code_challenge_method:"S256",code_challenge:c})}`;
}
async function tokenReq(p){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:S.get("spotifyId"),...p})});
  const j=await r.json();
  if(j.access_token){S.set("spTok",j.access_token);S.set("spExp",Date.now()+j.expires_in*1000-60000);if(j.refresh_token)S.set("spRef",j.refresh_token)}
}
async function spToken(){
  if(!S.get("spTok"))return null;
  if(Date.now()>+S.get("spExp"))await tokenReq({grant_type:"refresh_token",refresh_token:S.get("spRef")});
  return S.get("spTok");
}
async function sp(path,opt={}){
  const t=await spToken();if(!t)throw new Error("Spotify not connected");
  return fetch("https://api.spotify.com/v1"+path,{...opt,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"}});
}
const tools={
  async play_song({query}){
    const r=await sp("/search?"+new URLSearchParams({q:query,type:"track",limit:1}));
    const t=(await r.json()).tracks?.items?.[0];if(!t)return "No results for "+query;
    const p=await sp("/me/player/play",{method:"PUT",body:JSON.stringify({uris:[t.uri]})});
    if(p.status==404)return "No active Spotify device. Open the Spotify app, play anything once, then retry.";
    if(p.status==403)return "Spotify refused. Premium is required.";
    return `Now playing ${t.name} by ${t.artists[0].name}.`;
  },
  async pause_music(){await sp("/me/player/pause",{method:"PUT"});return "Paused."}
};

// ---------- Claude ----------
const SYSTEM="You are Jarvis, a calm, dryly witty British butler-style assistant. Replies are spoken aloud: 1-3 short sentences, no markdown or lists. Use play_song for music requests and pause_music to pause.";
const TOOLS=[
  {name:"play_song",description:"Search Spotify for a song and play it.",input_schema:{type:"object",properties:{query:{type:"string",description:"Song title and artist"}},required:["query"]}},
  {name:"pause_music",description:"Pause Spotify playback.",input_schema:{type:"object",properties:{}}}
];
let hist=[];
async function ask(text){
  if(hist.length>30)hist=[];
  hist.push({role:"user",content:text});
  for(let i=0;i<5;i++){
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.get("anthropic"),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:400,system:SYSTEM,tools:TOOLS,messages:hist})});
    const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
    hist.push({role:"assistant",content:j.content});
    if(j.stop_reason!=="tool_use")return j.content.filter(b=>b.type=="text").map(b=>b.text).join(" ");
    const res=[];
    for(const b of j.content)if(b.type=="tool_use"){let out;try{out=await tools[b.name](b.input)}catch(e){out="Error: "+e.message}res.push({type:"tool_result",tool_use_id:b.id,content:out})}
    hist.push({role:"user",content:res});
  }
  return "Apologies, that got tangled.";
}

// ---------- Voice out ----------
async function speak(text){
  log("ai",text);
  const key=S.get("elKey"),voice=S.get("elVoice");
  if(key&&voice){
    try{
      const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice}`,{method:"POST",headers:{"xi-api-key":key,"content-type":"application/json"},body:JSON.stringify({text,model_id:"eleven_turbo_v2_5"})});
      if(r.ok){const a=new Audio(URL.createObjectURL(await r.blob()));await new Promise(res=>{a.onended=res;a.onerror=res;a.play().catch(res)});return}
    }catch(e){}
  }
  await new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text);u.lang="en-GB";u.pitch=.8;
    const v=speechSynthesis.getVoices().find(v=>/en[-_]GB/i.test(v.lang));if(v)u.voice=v;
    u.onend=res;u.onerror=res;speechSynthesis.speak(u);
  });
}

// ---------- Wake word + listening ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,listening=false,busy=false,awakeUntil=0;
function startRec(){
  if(!SR){status("Speech recognition unsupported. Use Chrome on Android.");return}
  rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang="en-US";
  rec.onresult=e=>handle(e.results[e.results.length-1][0].transcript.trim());
  rec.onend=()=>{if(listening&&!busy)try{rec.start()}catch(e){}};
  rec.onerror=e=>{if(e.error=="not-allowed"){listening=false;$("orb").className="";status("Microphone blocked. Allow it in site settings.")}};
  rec.start();
}
async function handle(t){
  if(busy)return;
  const m=t.match(/\bjarvis\b[,.!?]?\s*(.*)/i);
  let cmd=null;
  if(m){cmd=m[1].trim();if(!cmd){awakeUntil=Date.now()+8000;status("Yes?");return}}
  else if(Date.now()<awakeUntil)cmd=t;
  if(!cmd)return;
  awakeUntil=0;busy=true;rec.stop();
  log("me",cmd);status("Thinking…");
  try{await speak(await ask(cmd))}catch(e){log("ai","Error: "+e.message);status("Error")}
  busy=false;status("Say “Jarvis…”");
  if(listening)try{rec.start()}catch(e){}
}
$("orb").onclick=()=>{
  listening=!listening;$("orb").className=listening?"on":"";$("orb").textContent=listening?"Listening":"Tap to start";
  if(listening){startRec();status("Say “Jarvis…”")}else{rec&&rec.stop();status("Paused")}
};

// ---------- Settings ----------
const fields=["anthropic","spotifyId","elKey","elVoice"];
fields.forEach(f=>$(f).value=S.get(f));
$("save").onclick=()=>{fields.forEach(f=>S.set(f,$(f).value.trim()));$("spstat").textContent="Saved."};
$("conn").onclick=()=>{fields.forEach(f=>S.set(f,$(f).value.trim()));spLogin()};
(async()=>{
  const code=new URLSearchParams(location.search).get("code");
  if(code){await tokenReq({grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:S.get("verifier")});history.replaceState({},"",REDIRECT)}
  $("spstat").textContent=S.get("spTok")?"Spotify connected.":"Spotify not connected.";
})();
</script></body></html>
